<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estigma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
  <style>
    /* 0 → 0,3 s: o poder é puxado para dentro · 0,3 s: explode (junto com o som) · até 2,5 s: some */
    :root { --dur: 2.5s; --glow: drop-shadow(0 0 5px rgba(255, 70, 80, .95)) drop-shadow(0 0 18px rgba(255, 20, 35, .9)) drop-shadow(0 0 50px rgba(220, 0, 20, .65));
      --glow2: drop-shadow(0 0 9px rgba(255, 110, 110, 1)) drop-shadow(0 0 32px rgba(255, 20, 35, 1)) drop-shadow(0 0 90px rgba(230, 0, 25, .85)); }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
    body { display: grid; place-items: center; font-family: Cinzel, Georgia, serif; }
    body:not(.vai) * { animation-play-state: paused !important; }

    #veu { position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at center, rgba(50, 0, 6, .5) 0%, rgba(10, 0, 2, .72) 65%, rgba(0, 0, 0, .85) 100%);
      opacity: 0; animation: veu var(--dur) ease-in-out forwards; }
    @keyframes veu { 0% { opacity: 0; } 6% { opacity: 1; } 82% { opacity: 1; } 100% { opacity: 0; } }

    #palco { position: relative; width: min(62vmin, 520px); aspect-ratio: 1; display: grid; place-items: center; }

    /* carga: um anel de energia que se fecha no centro antes da explosão */
    #carga { position: absolute; inset: -60%; border-radius: 50%; opacity: 0;
      background: radial-gradient(circle, transparent 38%, rgba(255, 30, 45, .5) 46%, rgba(255, 30, 45, 0) 56%);
      animation: carga var(--dur) cubic-bezier(.6, 0, 1, .6) forwards; }
    @keyframes carga { 0% { opacity: 0; transform: scale(1.2); } 4% { opacity: 1; } 12% { opacity: 1; transform: scale(.05); } 12.1%, 100% { opacity: 0; transform: scale(.05); } }

    /* brilho atrás do símbolo */
    #aura { position: absolute; inset: -20%; border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 40, 55, .6) 0%, rgba(200, 10, 25, .28) 36%, rgba(120, 0, 10, 0) 68%);
      opacity: 0; animation: aura var(--dur) ease-out forwards; }
    @keyframes aura { 0%, 11% { opacity: 0; transform: scale(.2); } 15% { opacity: 1; transform: scale(1.25); } 24% { transform: scale(.95); }
      34% { transform: scale(1.1); } 44% { transform: scale(.98); } 54% { transform: scale(1.08); } 82% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(1.4); } }

    /* o símbolo vermelho, com o brilho em volta */
    @property --r { syntax: "<percentage>"; inherits: true; initial-value: 0%; }
    #sigilo { position: relative; width: 78%; aspect-ratio: 1; opacity: 0;
      animation: entra var(--dur) cubic-bezier(.2, .9, .2, 1) forwards, acende var(--dur) ease-out forwards; }
    #sigilo img { width: 100%; height: 100%; display: block; animation: tremor .09s steps(2) infinite;
      -webkit-mask: radial-gradient(circle, #000 var(--r), transparent calc(var(--r) + 14%)); mask: radial-gradient(circle, #000 var(--r), transparent calc(var(--r) + 14%)); }
    @keyframes acende { 0%, 12% { --r: 0%; } 19% { --r: 85%; } 100% { --r: 85%; } }
    @keyframes entra {
      0%, 11.9% { opacity: 0; transform: scale(1.7); filter: blur(10px); }
      12% { opacity: 1; transform: scale(1.5); filter: blur(4px) var(--glow2); }
      16% { transform: scale(.93); filter: blur(0) var(--glow2); }
      20% { transform: scale(1.03); filter: blur(0) var(--glow); }
      24% { transform: scale(1); }
      34% { transform: scale(1.05); filter: blur(0) var(--glow2); }
      42% { transform: scale(1); filter: blur(0) var(--glow); }
      54% { transform: scale(1.04); filter: blur(0) var(--glow2); }
      64% { transform: scale(1); filter: blur(0) var(--glow); }
      82% { opacity: 1; transform: scale(1); filter: blur(0) var(--glow); }
      100% { opacity: 0; transform: scale(1.18); filter: blur(10px) drop-shadow(0 0 30px rgba(255, 20, 35, .4)); }
    }
    @keyframes tremor { 0% { transform: translate(0, 0); } 50% { transform: translate(.8px, -.7px); } }

    /* onda de choque */
    .onda { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px; border-radius: 50%; opacity: 0;
      border: 3px solid rgba(255, 60, 70, .9); box-shadow: 0 0 22px 6px rgba(255, 20, 35, .7), inset 0 0 18px rgba(255, 20, 35, .6);
      animation: onda var(--dur) cubic-bezier(.1, .8, .3, 1) forwards; }
    .onda.b { animation-name: onda2; border-width: 2px; }
    @keyframes onda { 0%, 11.9% { opacity: 0; transform: scale(1); } 12% { opacity: 1; } 40% { opacity: 0; transform: scale(160); } 100% { opacity: 0; transform: scale(160); } }
    @keyframes onda2 { 0%, 15% { opacity: 0; transform: scale(1); } 16% { opacity: .8; } 46% { opacity: 0; transform: scale(110); } 100% { opacity: 0; transform: scale(110); } }

    /* clarão da explosão */
    #clarao { position: fixed; inset: 0; pointer-events: none; opacity: 0;
      background: radial-gradient(circle, rgba(255, 120, 120, .8), rgba(255, 20, 35, .35) 30%, rgba(255, 0, 20, 0) 70%);
      animation: clarao var(--dur) ease-out forwards; }
    @keyframes clarao { 0%, 11.9% { opacity: 0; } 12% { opacity: 1; } 26% { opacity: 0; } 100% { opacity: 0; } }

    #nome { position: absolute; left: 0; right: 0; top: 100%; margin-top: 2vmin; text-align: center; color: #ffd9db;
      font-weight: 700; font-size: clamp(16px, 3.4vmin, 34px); letter-spacing: .38em; text-indent: .38em; text-transform: uppercase;
      text-shadow: 0 0 8px rgba(255, 40, 50, .9), 0 0 24px rgba(200, 0, 20, .8); opacity: 0; animation: nome var(--dur) ease-out forwards; }
    #nome small { display: block; font-size: .5em; letter-spacing: .5em; color: #ff8d93; margin-bottom: .4em; }
    @keyframes nome { 0%, 16% { opacity: 0; letter-spacing: .9em; } 28% { opacity: 1; letter-spacing: .38em; } 82% { opacity: 1; } 100% { opacity: 0; } }

    /* brasas lançadas pela explosão */
    .brasa { position: fixed; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px; border-radius: 50%; background: #ff4a52;
      box-shadow: 0 0 8px 2px rgba(255, 30, 40, .85); opacity: 0; animation: voa var(--d, 1s) cubic-bezier(.05, .7, .3, 1) .3s forwards; }
    @keyframes voa { 0% { opacity: 1; transform: translate(0, 0) scale(1.4); } 70% { opacity: .9; } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.3); } }
    .culpa .brasa { animation-name: voaCai; width: 4px; height: 8px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; }
    @keyframes voaCai { 0% { opacity: 1; transform: translate(0, 0); } 35% { opacity: 1; transform: translate(calc(var(--dx) * .5), calc(var(--dy) * .5)); } 100% { opacity: 0; transform: translate(calc(var(--dx) * .6), calc(var(--dy) * .5 + 40vh)); } }

    /* ----- Cada estigma tem o seu jeito ----- */
    /* Desejo: o símbolo chega girando, puxado */
    .desejo #palco { animation: gira var(--dur) cubic-bezier(.2, .9, .2, 1) forwards; }
    @keyframes gira { 0%, 12% { transform: rotate(-70deg); } 22% { transform: rotate(4deg); } 100% { transform: rotate(10deg); } }
    /* Rancor: a tela inteira treme com a pancada */
    .rancor #palco { animation: treme .55s linear .3s; }
    .rancor .onda { border-width: 5px; }
    @keyframes treme { 0%, 100% { transform: translate(0, 0); } 10% { transform: translate(-16px, 10px); } 20% { transform: translate(14px, -12px); } 30% { transform: translate(-12px, -8px); }
      45% { transform: translate(9px, 8px); } 60% { transform: translate(-6px, 3px); } 80% { transform: translate(3px, -3px); } }
    /* Culpa: cai pesado do alto */
    .culpa #palco { animation: desce var(--dur) cubic-bezier(.5, 0, .2, 1) forwards; }
    @keyframes desce { 0%, 10% { transform: translateY(-20vh); } 15% { transform: translateY(1vh); } 20% { transform: translateY(0); } 100% { transform: translateY(2vh); } }
    /* Prazer: pulsa como um coração disparado */
    .prazer #palco { animation: pulsa .3s ease-in-out .38s 6; }
    @keyframes pulsa { 0%, 100% { transform: scale(1); } 25% { transform: scale(1.08); } 45% { transform: scale(1.01); } 65% { transform: scale(1.05); } }
    .prazer #aura { inset: -30%; }
    /* Orgulho: se ergue, com raios atrás */
    .orgulho #palco { animation: ergue var(--dur) cubic-bezier(.2, .9, .2, 1) forwards; }
    @keyframes ergue { 0%, 12% { transform: translateY(10vh) scale(.85); } 20% { transform: translateY(0) scale(1.06); } 100% { transform: translateY(-1vh) scale(1.1); } }
    #raios { position: absolute; inset: -45%; opacity: 0; display: none;
      background: repeating-conic-gradient(from 0deg, rgba(255, 30, 45, .26) 0deg 4deg, rgba(255, 30, 45, 0) 4deg 18deg);
      -webkit-mask: radial-gradient(circle, #000 18%, transparent 65%); mask: radial-gradient(circle, #000 18%, transparent 65%); }
    .orgulho #raios { display: block; animation: raios var(--dur) ease-out forwards; }
    @keyframes raios { 0%, 12% { opacity: 0; transform: rotate(0) scale(.4); } 20% { opacity: 1; transform: rotate(8deg) scale(1); } 82% { opacity: .8; } 100% { opacity: 0; transform: rotate(24deg) scale(1.1); } }

    @media (prefers-reduced-motion: reduce) {
      #palco, .rancor #palco, .prazer #palco, .desejo #palco, .culpa #palco, .orgulho #palco { animation: none !important; }
      #sigilo img { animation: none; }
      .brasa, .onda { display: none; }
    }
  </style>
</head>
<body>
  <div id="veu"></div>
  <div id="clarao"></div>
  <div class="onda"></div><div class="onda b"></div>
  <div id="palco">
    <div id="carga"></div>
    <div id="raios"></div>
    <div id="aura"></div>
    <div id="sigilo"><img id="img" alt=""></div>
    <div id="nome"><small>Estigma</small><span id="nomeTxt"></span></div>
  </div>
  <script type="module" src="estigma.js?v=1.11.0"></script>
</body>
</html>

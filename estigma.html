<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estigma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root { --red: #e0141f; --deep: #7a0710; --dur: 4.4s; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
    body { display: grid; place-items: center; font-family: Cinzel, Georgia, serif; }

    /* véu escuro que deixa a cena aparecer por baixo */
    #veu { position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at center, rgba(40, 0, 4, .45) 0%, rgba(8, 0, 1, .68) 70%, rgba(0, 0, 0, .8) 100%);
      opacity: 0; animation: veu var(--dur) ease-in-out forwards; }
    @keyframes veu { 0% { opacity: 0; } 12% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }

    #palco { position: relative; width: min(62vmin, 520px); aspect-ratio: 1; display: grid; place-items: center; }

    /* brilho atrás do símbolo */
    #aura { position: absolute; inset: -18%; border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 30, 45, .55) 0%, rgba(200, 10, 25, .25) 35%, rgba(120, 0, 10, 0) 68%);
      opacity: 0; transform: scale(.4); animation: aura var(--dur) ease-out forwards; }
    @keyframes aura { 0% { opacity: 0; transform: scale(.4); } 22% { opacity: 1; transform: scale(1.05); } 30% { transform: scale(.95); }
      40% { transform: scale(1.08); } 52% { transform: scale(.97); } 64% { transform: scale(1.06); } 80% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(1.3); } }

    /* o símbolo vermelho, com o brilho em volta */
    #sigilo { position: relative; width: 78%; aspect-ratio: 1; opacity: 0;
      filter: drop-shadow(0 0 6px rgba(255, 60, 70, .95)) drop-shadow(0 0 22px rgba(255, 20, 35, .85)) drop-shadow(0 0 60px rgba(220, 0, 20, .6));
      animation: entra var(--dur) cubic-bezier(.2, .8, .2, 1) forwards; }
    #sigilo img { width: 100%; height: 100%; display: block; animation: tremor 0.11s steps(2) infinite; }
    /* o traço "acende" de dentro para fora */
    #sigilo img { -webkit-mask: radial-gradient(circle, #000 var(--r, 0%), transparent calc(var(--r, 0%) + 12%)); mask: radial-gradient(circle, #000 var(--r, 0%), transparent calc(var(--r, 0%) + 12%)); }
    @property --r { syntax: "<percentage>"; inherits: true; initial-value: 0%; }
    #sigilo { animation: entra var(--dur) cubic-bezier(.2, .8, .2, 1) forwards, acende var(--dur) ease-out forwards; }
    @keyframes acende { 0% { --r: 0%; } 6% { --r: 0%; } 26% { --r: 80%; } 100% { --r: 80%; } }
    @keyframes entra {
      0% { opacity: 0; transform: scale(1.35); filter: blur(14px) drop-shadow(0 0 0 transparent); }
      8% { opacity: .2; }
      24% { opacity: 1; transform: scale(1); filter: blur(0) drop-shadow(0 0 6px rgba(255, 60, 70, .95)) drop-shadow(0 0 22px rgba(255, 20, 35, .85)) drop-shadow(0 0 60px rgba(220, 0, 20, .6)); }
      40% { transform: scale(1.04); filter: blur(0) drop-shadow(0 0 10px rgba(255, 90, 90, 1)) drop-shadow(0 0 34px rgba(255, 20, 35, .95)) drop-shadow(0 0 90px rgba(220, 0, 20, .75)); }
      52% { transform: scale(1); filter: blur(0) drop-shadow(0 0 6px rgba(255, 60, 70, .95)) drop-shadow(0 0 22px rgba(255, 20, 35, .85)) drop-shadow(0 0 60px rgba(220, 0, 20, .6)); }
      64% { transform: scale(1.03); filter: blur(0) drop-shadow(0 0 10px rgba(255, 90, 90, 1)) drop-shadow(0 0 34px rgba(255, 20, 35, .95)) drop-shadow(0 0 90px rgba(220, 0, 20, .75)); }
      78% { opacity: 1; transform: scale(1); filter: blur(0) drop-shadow(0 0 6px rgba(255, 60, 70, .95)) drop-shadow(0 0 22px rgba(255, 20, 35, .85)) drop-shadow(0 0 60px rgba(220, 0, 20, .6)); }
      100% { opacity: 0; transform: scale(1.12); filter: blur(8px) drop-shadow(0 0 30px rgba(255, 20, 35, .4)); }
    }
    @keyframes tremor { 0% { transform: translate(0, 0); } 50% { transform: translate(.6px, -.5px); } }

    #nome { position: absolute; left: 0; right: 0; top: 100%; margin-top: 2vmin; text-align: center; color: #ffd9db;
      font-weight: 700; font-size: clamp(16px, 3.4vmin, 34px); letter-spacing: .38em; text-indent: .38em; text-transform: uppercase;
      text-shadow: 0 0 8px rgba(255, 40, 50, .9), 0 0 24px rgba(200, 0, 20, .8); opacity: 0; animation: nome var(--dur) ease-out forwards; }
    #nome small { display: block; font-size: .5em; letter-spacing: .5em; color: #ff8d93; margin-bottom: .4em; }
    @keyframes nome { 0%, 22% { opacity: 0; letter-spacing: .8em; } 38% { opacity: 1; letter-spacing: .38em; } 78% { opacity: 1; } 100% { opacity: 0; } }

    /* brasas */
    .brasa { position: fixed; width: 4px; height: 4px; border-radius: 50%; background: #ff3b45; box-shadow: 0 0 8px 2px rgba(255, 30, 40, .8);
      opacity: 0; animation: sobe var(--d, 2.6s) ease-out var(--atraso, 0s) forwards; }
    @keyframes sobe { 0% { opacity: 0; transform: translate(0, 0) scale(1); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx, 0), var(--dy, -40vh)) scale(.3); } }

    /* clarão */
    #clarao { position: fixed; inset: 0; background: radial-gradient(circle, rgba(255, 60, 70, .55), rgba(255, 0, 20, 0) 60%); opacity: 0; pointer-events: none; }

    /* ----- Cada estigma entra do seu jeito ----- */
    /* Desejo: gira devagar até o lugar, como algo que puxa */
    .desejo #palco { animation: gira var(--dur) cubic-bezier(.2, .8, .2, 1) forwards; }
    @keyframes gira { 0% { transform: rotate(-40deg); } 28% { transform: rotate(0); } 100% { transform: rotate(6deg); } }
    /* Rancor: bate com força, tremendo a tela */
    .rancor #sigilo { animation-name: entraForte, acende; }
    @keyframes entraForte {
      0% { opacity: 0; transform: scale(2.2); } 9% { opacity: 1; transform: scale(.94); } 13% { transform: scale(1.03); } 17% { transform: scale(1); filter: drop-shadow(0 0 6px rgba(255, 60, 70, .95)) drop-shadow(0 0 22px rgba(255, 20, 35, .85)) drop-shadow(0 0 60px rgba(220, 0, 20, .6)); }
      78% { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 8px rgba(255, 60, 70, 1)) drop-shadow(0 0 30px rgba(255, 20, 35, .9)) drop-shadow(0 0 80px rgba(220, 0, 20, .7)); }
      100% { opacity: 0; transform: scale(1.15); filter: blur(6px); } }
    .rancor #clarao { animation: clarao 0.7s ease-out 0.35s forwards; }
    .rancor #palco { animation: treme 0.6s linear 0.38s; }
    @keyframes clarao { 0% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes treme { 0%, 100% { transform: translate(0, 0); } 10% { transform: translate(-10px, 6px); } 20% { transform: translate(9px, -7px); } 30% { transform: translate(-7px, -5px); }
      45% { transform: translate(6px, 5px); } 60% { transform: translate(-4px, 2px); } 80% { transform: translate(2px, -2px); } }
    /* Culpa: desce pesado, e as brasas caem como gotas */
    .culpa #palco { animation: desce var(--dur) cubic-bezier(.3, .7, .2, 1) forwards; }
    @keyframes desce { 0% { transform: translateY(-14vh); } 30% { transform: translateY(0); } 100% { transform: translateY(2vh); } }
    .culpa .brasa { border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; width: 4px; height: 7px; }
    /* Prazer: pulsa como um coração acelerado */
    .prazer #palco { animation: pulsa 0.62s ease-in-out 0.9s 5; }
    @keyframes pulsa { 0%, 100% { transform: scale(1); } 18% { transform: scale(1.07); } 32% { transform: scale(1.01); } 46% { transform: scale(1.05); } }
    .prazer #aura { inset: -28%; }
    /* Orgulho: sobe e se impõe, com raios atrás */
    .orgulho #palco { animation: ergue var(--dur) cubic-bezier(.2, .8, .2, 1) forwards; }
    @keyframes ergue { 0% { transform: translateY(12vh) scale(.85); } 30% { transform: translateY(0) scale(1.06); } 100% { transform: translateY(-1vh) scale(1.1); } }
    #raios { position: absolute; inset: -40%; opacity: 0; display: none;
      background: repeating-conic-gradient(from 0deg, rgba(255, 30, 45, .22) 0deg 4deg, rgba(255, 30, 45, 0) 4deg 18deg);
      -webkit-mask: radial-gradient(circle, #000 20%, transparent 65%); mask: radial-gradient(circle, #000 20%, transparent 65%); }
    .orgulho #raios { display: block; animation: raios var(--dur) ease-out forwards; }
    @keyframes raios { 0%, 18% { opacity: 0; transform: rotate(0) scale(.6); } 35% { opacity: 1; transform: rotate(8deg) scale(1); } 80% { opacity: .8; } 100% { opacity: 0; transform: rotate(24deg) scale(1.1); } }

    @media (prefers-reduced-motion: reduce) {
      #palco, .rancor #palco, .prazer #palco, .desejo #palco, .culpa #palco, .orgulho #palco { animation: none !important; }
      #sigilo img { animation: none; }
      .brasa { display: none; }
    }
  </style>
</head>
<body>
  <div id="veu"></div>
  <div id="clarao"></div>
  <div id="palco">
    <div id="raios"></div>
    <div id="aura"></div>
    <div id="sigilo"><img id="img" alt=""></div>
    <div id="nome"><small>Estigma</small><span id="nomeTxt"></span></div>
  </div>
  <script type="module" src="estigma.js?v=1.10.0"></script>
</body>
</html>

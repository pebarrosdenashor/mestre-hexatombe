<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caixa de som</title>
  <style>
    :root { --bg: #160809; --line: #5c1f29; --accent: #c8102e; --text: #f0e9ea; --muted: #b9a7aa; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; color: var(--text); font: 13px/1.3 Roboto, system-ui, sans-serif; }
    #caixa { position: absolute; left: 0; bottom: 0; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 6px;
      background: rgba(22, 8, 9, .92); border: 1px solid var(--line); border-radius: 22px; box-shadow: 0 2px 10px rgba(0,0,0,.5); }
    button { all: unset; cursor: pointer; display: grid; place-items: center; }
    #btn { width: 32px; height: 32px; border-radius: 50%; font-size: 17px; }
    #btn:focus-visible, #ativar:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #ativar { height: 32px; padding: 0 12px; border-radius: 16px; background: var(--accent); color: #fff; font-weight: 700; white-space: nowrap; }
    .bloq #caixa { animation: pulso 1.6s ease-in-out infinite; }
    @keyframes pulso { 50% { box-shadow: 0 0 0 4px rgba(200, 16, 46, .45), 0 2px 10px rgba(0,0,0,.5); } }
    @media (prefers-reduced-motion: reduce) { .bloq #caixa { animation: none; } }
    #vol { width: 120px; accent-color: var(--accent); }
    #pct { width: 34px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .esconde { display: none !important; }
    #tocando { color: var(--muted); max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
  </style>
</head>
<body>
  <div id="caixa">
    <button id="btn" title="Sons do mestre" aria-label="Sons do mestre">🔊</button>
    <button id="ativar" class="esconde">Clique para ouvir os sons</button>
    <input id="vol" type="range" min="0" max="100" step="5" class="esconde" aria-label="Volume">
    <span id="pct" class="esconde"></span>
    <span id="tocando" class="esconde"></span>
  </div>
  <script type="module" src="som.js"></script>
</body>
</html>
